title = "gitleaks config for folio-sub-ledger"

# Layer allowlist exceptions on top of gitleaks' built-in rule set rather than
# redefining it (https://github.com/gitleaks/gitleaks#configuration).
[extend]
useDefault = true

[allowlist]
description = "SonarCloud project key, an identifier rather than a secret"
regexes = ['''ahmax99_folio-sub-ledger''']
