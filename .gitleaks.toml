title = "gitleaks config for boilerplate-template"

# Layer allowlist exceptions on top of gitleaks' built-in rule set rather than
# redefining it (https://github.com/gitleaks/gitleaks#configuration).
[extend]
useDefault = true

# Single-table `[allowlist]`, not `[[allowlists]]`: CI's gitleaks-action pins 8.24.x, which predates the plural form.
[allowlist]
description = "Vendored modern-web-guidance guide: 'MLKEM768-X25519' is a WebCrypto algorithm name, not a key"
paths = [
  '''^\.agents/skills/modern-web-guidance/guides/security/client-side-encryption\.md$'''
]
