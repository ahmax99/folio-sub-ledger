      <title id="auth-system-flow-title">Authentication and authorization, end to end</title>
      <desc id="auth-system-flow-desc">System flow diagram in four zones. In the browser, two iron-session cookies: the transient auth_pkce handshake cookie and the long-lived auth_session cookie holding only a refresh token. In the Next.js BFF, the proxy.ts edge guard and the login, callback, logout and authenticated API-client handlers. In AWS Cognito, the Hosted UI authorize endpoint, the token endpoint under both the authorization_code and refresh_token grants, and the logout endpoint. In the stateless Elysia backend, the authPlugin that verifies the Cognito JWT and the CASL ability derived from its claims. Nineteen numbered steps trace login initiation, the PKCE callback and token exchange, the authenticated backend call with its 200 JSON return and the response back to the browser, and logout.</desc>
