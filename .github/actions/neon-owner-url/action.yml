name: 'Neon owner URL'
description: "Gets the folio_owner connection string of the environment's Neon project. Needs NEON_API_KEY and NEON_PROJECT_ID in the calling step's env."

inputs:
  pooled:
    description: 'Return the pooled URL; migrations need the direct one'
    required: false
    default: 'false'

outputs:
  database_url:
    description: 'folio_owner connection string (masked); pass it to run steps only through env'
    value: ${{ steps.url.outputs.database_url }}

runs:
  using: 'composite'
  steps:
    - name: Get the owner connection string
      id: url
      shell: bash
      env:
        POOLED: ${{ inputs.pooled }}
      run: |
        set -euo pipefail
        : "${NEON_PROJECT_ID:?NEON_PROJECT_ID is required: set it in the environment from the Terraform output neon_project_id}"
        # The default branch's read-write endpoint; the CLI reads NEON_API_KEY from the environment.
        url=$(npx --yes neon@9.5.0 connection-string --project-id "$NEON_PROJECT_ID" \
          --role-name folio_owner --database-name folio --endpoint-type read_write \
          --pooled="$POOLED" --no-analytics </dev/null)
        case "$url" in postgresql://* | postgres://*) ;; *) echo "::error::The Neon CLI returned no connection string"; exit 1 ;; esac
        password="${url#*://*:}"
        echo "::add-mask::${password%%@*}"
        echo "::add-mask::${url}"
        echo "database_url=${url}" >>"$GITHUB_OUTPUT"
