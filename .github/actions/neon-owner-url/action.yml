name: 'Neon owner URL'
description: "Finds the environment's Terraform-managed Neon project and, optionally, the folio_owner connection string. Needs NEON_API_KEY and NEON_ORG_ID in the job env."

inputs:
  environment:
    description: 'dev or prod; the project is <repository>-<environment>'
    required: true
  branch:
    description: "Neon branch name or ID; empty means the project's default branch"
    required: false
    default: ''
  pooled:
    description: 'Return the pooled URL; migrations need the direct one'
    required: false
    default: 'false'
  url:
    description: 'Fetch the owner connection string; false returns only project_id'
    required: false
    default: 'true'

outputs:
  project_id:
    description: 'ID of the Neon project'
    value: ${{ steps.lookup.outputs.project_id }}
  database_url:
    description: 'folio_owner connection string (masked); pass it to run steps only through env'
    value: ${{ steps.url.outputs.database_url }}

runs:
  using: 'composite'
  steps:
    - name: Find the Neon project
      id: lookup
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail
        case "$ENVIRONMENT" in dev | prod) ;; *) echo "::error::environment must be dev or prod"; exit 1 ;; esac
        name="${REPOSITORY}-${ENVIRONMENT}"
        matches=$("$GITHUB_WORKSPACE/.github/scripts/neon-find-project.sh" --name "$name")
        count=$(grep -c . <<<"$matches" || true)
        if [ "$count" -ne 1 ]; then
          echo "::error::Expected exactly one Neon project named ${name} in the organization, found ${count}. Terraform creates it on the first apply."
          exit 1
        fi
        echo "project_id=${matches}" >>"$GITHUB_OUTPUT"

    - name: Get the owner connection string
      id: url
      if: inputs.url == 'true'
      shell: bash
      env:
        PROJECT_ID: ${{ steps.lookup.outputs.project_id }}
        BRANCH: ${{ inputs.branch }}
        POOLED: ${{ inputs.pooled }}
      run: |
        set -euo pipefail
        args=(connection-string)
        [ -n "$BRANCH" ] && args+=("$BRANCH")
        args+=(--project-id "$PROJECT_ID" --role-name folio_owner --database-name folio)
        [ "$POOLED" = 'true' ] && args+=(--pooled)
        url=$(npx --yes neon@9.5.0 "${args[@]}" --no-analytics </dev/null)
        case "$url" in postgresql://* | postgres://*) ;; *) echo "::error::neon connection-string returned no URL"; exit 1 ;; esac
        password="${url#*://*:}"
        echo "::add-mask::${password%%@*}"
        echo "::add-mask::${url}"
        echo "database_url=${url}" >>"$GITHUB_OUTPUT"
