name: Rotate DB Credentials

# Gives the API's inactive runtime database user a new expiring password and makes it the active one.
# Runbook and design: docs/decisions/2026-11-21-rotated-runtime-database-credentials.md.

on:
  schedule:
    # Daily: each user is rotated every second day, well inside its 14-day validity.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rotate'
        required: true
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        description: 'dev or prod'
        required: true
        type: string

permissions: {}

jobs:
  rotate:
    name: Rotate → ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # A schedule has no inputs, so it rotates both environments.
        environment: ${{ fromJSON(inputs.environment && format('["{0}"]', inputs.environment) || '["dev","prod"]') }}
    # Restricted to main, no reviewer; holds the project-scoped NEON_API_KEY, NEON_PROJECT_ID and DB_ROTATION_ROLE_ARN.
    environment: ${{ matrix.environment }}-db-rotation
    permissions:
      id-token: write
      contents: read
    # Shared with the migrate jobs, so a rotation never overlaps a migration.
    concurrency:
      group: neon-migrate-${{ matrix.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get the owner URL from Neon
        id: owner
        uses: ./.github/actions/neon-owner-url
        with:
          # The secret's host is the pooled one the Lambda uses; ALTER ROLE works through it too.
          pooled: 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - name: Configure AWS credentials (rotation role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DB_ROTATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RotateDbCredentials

      - name: Rotate the runtime credential
        env:
          OWNER_URL: ${{ steps.owner.outputs.owner_url }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          chmod +x .github/scripts/rotate-runtime-credential.sh
          SECRET_ID="${GITHUB_REPOSITORY#*/}-${ENVIRONMENT}/database-url" .github/scripts/rotate-runtime-credential.sh
