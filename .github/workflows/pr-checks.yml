name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folio_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        id: build
        run: bunx turbo run build --filter='./shared/*'

      - name: Type-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check-types

      - name: Lint and format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run check-format

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test
